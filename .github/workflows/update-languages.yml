name: Actualizar lenguajes

on:
  schedule:
    - cron: "17 5 * * 1"   # lunes, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_languages.py "${{ github.repository_owner }}"
      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages-*.svg
          git diff --cached --quiet || git commit -m "chore: actualizar lenguajes"
          git push
